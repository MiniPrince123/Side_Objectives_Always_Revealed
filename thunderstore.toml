[config]
schemaVersion = "0.0.1"

[package]
namespace = "MiniPrince123"
name = "Side_Objectives_Always_Revealed"
description = "Reveals what each side objective is without having to get close to it."
websiteUrl = "https://github.com/MiniPrince123/SecondMycoMod"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
outdir = "build"
icon = "icon.png"
readme = "README.md"

[[build.copy]]
source = "bin/Release/netstandard2.1/Side_Objectives_Always_Revealed.dll"
target = "BepInEx/plugins/Side_Objectives_Always_Revealed.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk", ]

[publish.categories]
mycopunk = [ "cosmetic", "client", "qol", "mods"]
